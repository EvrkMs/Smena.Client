syntax = "proto3";

option csharp_namespace = "Host.Grpc.Services.Employee";

// Сущность Employee
message GrpcEmployee {
    string id = 1;
    string name = 2;
}

// Запрос для получения списка
message GrpcRequest {}

// Ответ со списком
message GrpcEmployeesResponse {
    repeated GrpcEmployee employees = 1;
}

message BoolResponse {
    bool value = 1;
}

// Сервис
service GrpcEmployeeService {
    rpc EmployeesList(GrpcRequest) returns (GrpcEmployeesResponse);

    rpc EmployeeAdd(GrpcEmployee) returns (BoolResponse);
}
